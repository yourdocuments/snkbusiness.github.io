<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers | SNK Business</title><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="app-body"><div class="app"><aside class="sidebar" id="sidebar"></aside><main class="main">
<header class="header"><button class="mobile-menu" onclick="toggleSidebar()">☰</button><div><div class="eyebrow">CUSTOMER MANAGEMENT</div><h1>Customers</h1></div><div class="header-user"><span id="userName"></span><button class="avatar" onclick="logout()">A</button></div></header>
<section class="content"><div class="page-title"><div><h2>Premium Customer Management</h2><p>Manage customers, contact details, business status and payment history.</p></div><button class="btn btn-primary" onclick="openCustomer()">+ Add Customer</button></div>
<div class="toolbar"><input id="search" placeholder="Search customers..." oninput="renderCustomers()"><select id="status" onchange="renderCustomers()"><option value="">All Status</option><option>Active</option><option>Pending</option><option>Inactive</option></select></div>
<div class="panel table-panel"><table><thead><tr><th>Customer</th><th>Business</th><th>Contact</th><th>Status</th><th>Balance</th><th>Action</th></tr></thead><tbody id="customerRows"></tbody></table></div></section>
</main></div>
<div id="modal" class="modal"><div class="modal-card"><button class="modal-close" onclick="closeCustomer()">×</button><h3>Add Customer</h3><p class="muted">Create a new customer record.</p><form id="customerForm"><label>Name<input id="cName" required></label><label>Business<input id="cBusiness" required></label><label>Phone<input id="cPhone" required></label><label>Balance<input id="cBalance" type="number" value="0"></label><button class="btn btn-primary full">Save Customer</button></form></div></div>
<script src="assets/js/app.js"></script><script src="assets/js/customers.js"></script></body></html>
