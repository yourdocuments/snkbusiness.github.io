<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SNK Business Admin Dashboard</title>

  <meta name="description" content="SNK Business Administration Dashboard">

  <link rel="icon" type="image/png" href="assets/favicon.png">

  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --secondary: #0f172a;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #f59e0b;
      --sidebar-width: 260px;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --radius: 18px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* =========================
       LOGIN PROTECTION
    ========================= */

    /* =========================
       MOBILE OVERLAY
    ========================= */

    .mobile-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      z-index: 90;
    }

    .mobile-overlay.show {
      display: block;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--sidebar-width);
      height: 100vh;
      background: #0b1220;
      color: #fff;
      z-index: 100;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .brand {
      height: 78px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .brand-logo {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      object-fit: contain;
      background: #fff;
      padding: 5px;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-name {
      font-size: 17px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-role {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 3px;
    }

    .sidebar-section {
      padding: 20px 14px 8px;
      color: #64748b;
      text-transform: uppercase;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .nav {
      padding: 6px 12px;
    }

    .nav-item {
      width: 100%;
      border: 0;
      background: transparent;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 13px;
      border-radius: 12px;
      margin-bottom: 5px;
      font-size: 14px;
      text-align: left;
      transition: 0.2s ease;
    }

    .nav-item:hover {
      background: rgba(255,255,255,0.07);
      color: #fff;
    }

    .nav-item.active {
      background: linear-gradient(
        135deg,
        var(--primary),
        var(--primary-dark)
      );
      color: #fff;
      box-shadow: 0 8px 20px rgba(37,99,235,0.25);
    }

    .nav-icon {
      width: 22px;
      text-align: center;
      font-size: 17px;
    }

    .sidebar-bottom {
      margin-top: auto;
      padding: 14px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .admin-mini {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px;
      margin-bottom: 10px;
    }

    .admin-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }

    .admin-mini-name {
      font-size: 13px;
      font-weight: 700;
    }

    .admin-mini-role {
      color: #94a3b8;
      font-size: 11px;
      margin-top: 2px;
    }

    .logout-btn {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(220,38,38,0.1);
      color: #fca5a5;
      padding: 11px 13px;
      border-radius: 10px;
      font-weight: 700;
    }

    .logout-btn:hover {
      background: rgba(220,38,38,0.2);
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      margin-left: var(--sidebar-width);
      min-height: 100vh;
    }

    .topbar {
      height: 78px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .menu-btn {
      display: none;
      border: 0;
      background: #eef2ff;
      color: var(--primary);
      width: 42px;
      height: 42px;
      border-radius: 10px;
      font-size: 20px;
    }

    .page-title h1 {
      font-size: 20px;
      font-weight: 800;
    }

    .page-title p {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
