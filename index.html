html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased}

.ic{width:20px;height:20px;flex:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.utility{background:var(--g9);color:#cfe9dd;font-size:13px}

.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;max-width:100%}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;color:var(--g9)}

.links{display:flex;gap:4px}
.links a{padding:8px 12px;border-radius:10px;font-size:14.5px;font-weight:500;color:var(--mut)}
.links a:hover{background:var(--g1);color:var(--g9)}
.nav-actions{display:flex;align-items:center;gap:14px}
.trade{font-size:14px;font-weight:600;color:var(--g7)}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:10px;font-size:20px;padding:4px 10px;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:12px;font-weight:600;font-size:15px;border:1.5px solid transparent;cursor:pointer;font-family:inherit;transition:.2s}
.btn .ic{width:18px;height:18px}
.btn-primary{background:var(--g7);color:#fff}.btn-primary:hover{background:var(--g9)}
.btn-outline{border-color:var(--g7);color:var(--g7);background:#fff}.btn-outline:hover{background:var(--g1)}
.label{display:inline-flex;align-items:center;gap:8px;background:var(--g1);color:var(--g7);padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600}
.label .ic{width:15px;height:15px}
h1{font-size:clamp(32px,5vw,54px);line-height:1.1;letter-spacing:-.02em;margin:16px 0}
h2{font-size:clamp(26px,3.6vw,38px);line-height:1.2;letter-spacing:-.015em;margin:12px 0}
.hero{max-width:1180px;margin:0 auto;padding:64px 20px;display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.intro{color:var(--mut);font-size:18px;max-width:560px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0}
.highlights{display:flex;gap:20px;flex-wrap:wrap}
.highlights li{display:flex;align-items:center;gap:8px;font-weight:500;font-size:14.5px}
.highlights .ic{color:var(--g5);width:18px}
.visual{position:relative;border-radius:24px;background:linear-gradient(135deg,var(--g9),var(--g5));min-height:380px;overflow:hidden}
.visual img{width:100%;height:100%;min-height:380px;object-fit:cover}
.caption{position:absolute;left:16px;right:16px;bottom:16px;background:#fff;border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.caption .ic{color:var(--g7);width:26px;height:26px}
.caption strong{display:block;font-size:14.5px}.caption span{font-size:13px;color:var(--mut)}
.sec{padding:80px 0}.tint{background:var(--tint)}
.intro-c{text-align:center;max-width:680px;margin:0 auto 44px}
.intro-c p,.lead{color:var(--mut);font-size:17px}
.grid{display:grid;gap:20px}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);transition:.2s}
.card:hover{box-shadow:0 12px 30px rgba(11,61,46,.1);transform:translateY(-3px)}
.about-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:48px;align-items:center}
.philosophy{background:linear-gradient(145deg,var(--g9),var(--g7));color:#fff;border-radius:24px;padding:32px;min-height:340px;display:flex;flex-direction:column;justify-content:space-between}
.philosophy small{opacity:.8;font-weight:500}
.pcard{background:rgba(255,255,255,.12);border-radius:16px;padding:22px}
.pcard strong{display:block;font-size:26px;margin:10px 0 4px}.pcard .label{background:rgba(255,255,255,.2);color:#fff}
.reasons{display:grid;gap:14px;margin-top:24px}
.reason{display:flex;gap:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.reason .ic{color:var(--g7);width:26px;height:26px;margin-top:2px}
.reason strong{display:block}.reason span{color:var(--mut);font-size:14.5px}
.cat{display:flex;gap:12px;align-items:center;padding:18px}
.cat .ic{width:30px;height:30px;color:var(--g7);background:var(--g1);padding:6px;border-radius:10px;box-sizing:content-box}
.cat strong{display:block;font-size:15px;line-height:1.3}.cat span{font-size:12.5px;color:var(--mut)}
.tools{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;min-width:260px}
.search input{border:0;outline:0;padding:12px 0;font:inherit;width:100%;background:none}
.search .ic{color:var(--mut);width:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.chip.on{background:var(--g7);color:#fff;border-color:var(--g7)}
.program{overflow:hidden;display:flex;flex-direction:column}
.art{height:130px;background:linear-gradient(135deg,var(--g9),var(--g5));color:#fff;position:relative;display:grid;place-items:center}
.art .ic{width:46px;height:46px;opacity:.9}
.tag{position:absolute;left:14px;top:14px;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600}
.num{position:absolute;right:16px;bottom:8px;font-size:30px;font-weight:700;opacity:.35}
.pbody{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}
.pbody h3{font-size:19px}.pbody p{color:var(--mut);font-size:14.5px;flex:1}
.meta{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--g7);font-weight:500}.meta .ic{width:16px}
.pfoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px;font-size:13px;color:var(--mut)}
.req{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--g7)}.req .ic{width:16px}
.none{text-align:center;color:var(--mut);margin-top:24px}
.mode{padding:24px}.mode .ic{width:32px;height:32px;color:var(--g7);margin-bottom:12px}.mode strong{display:block;margin-bottom:4px}.mode p{color:var(--mut);font-size:14.5px}
.team-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:36px}
.expert{overflow:hidden}
.avatar-bg{background:var(--g1);padding:26px;display:grid;place-items:center}
.avatar{width:92px;height:92px;border-radius:50%;background:linear-gradient(135deg,var(--g7),var(--g5));color:#fff;display:grid;place-items:center;font-weight:700;font-size:26px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.ebody{padding:18px}.ebody strong{display:block}.role{color:var(--g7);font-size:13.5px;font-weight:600;margin-bottom:6px}
.ebody p{color:var(--mut);font-size:14px;margin-bottom:10px}.ebody a{font-weight:600;font-size:14px;color:var(--g7);display:inline-flex;gap:6px;align-items:center}.ebody a .ic{width:15px}
.solutions{background:var(--g9);color:#fff;padding:80px 0}
.solutions .lead{color:#b9d9ca}.solutions .label{background:rgba(255,255,255,.15);color:#fff}
.sol-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.checks{display:grid;gap:12px;margin-top:22px}.checks li{display:flex;gap:10px;align-items:center;font-weight:500}.checks .ic{color:var(--g5)}
.journey{background:#fff;color:var(--ink);border-radius:24px;padding:30px}
.journey>p{color:var(--mut);margin:6px 0 18px}
.stages{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.stage{background:var(--tint);border-radius:14px;padding:16px}.stage .ic{color:var(--g7);margin-bottom:6px}.stage strong{display:block}.stage span{font-size:13px;color:var(--mut)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.step{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px}
.step .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.step .n{font-size:30px;font-weight:700;color:var(--g5)}.step .ic{color:var(--mut)}.step p{color:var(--mut);font-size:14.5px;margin-top:6px}
.consult{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.note{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:24px}
.note .ic{color:var(--g7);margin-bottom:6px}.note p{color:var(--mut);font-size:14.5px}
.form{background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 20px 50px rgba(11,61,46,.08)}
.form>p{color:var(--mut);margin:4px 0 18px;font-size:14.5px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14.5px;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--g5);border-color:transparent}
.field textarea{min-height:90px;resize:vertical}
.fine{font-size:12.5px;color:var(--mut);margin-top:10px}
.faq{max-width:780px;margin:0 auto;display:grid;gap:12px}
.faq-item{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}

.faq-item.open .faq-q .ic{transform:rotate(45deg)}
.more{text-align:center;margin-top:28px;color:var(--mut)}.more a{color:var(--g7);font-weight:600;display:inline-flex;gap:6px;align-items:center}.more a .ic{width:16px}
.cta{background:var(--g1);padding:34px 0}.cta .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.cta p{font-weight:600;font-size:18px;color:var(--g9)}
footer{background:var(--g9);color:#b9d9ca;padding:56px 0 24px}
footer .brand{color:#fff}
.foot{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:32px}
.about{margin:14px 0;font-size:14.5px;max-width:320px}
.social{display:flex;gap:10px}.social a{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.1);display:grid;place-items:center;color:#fff}.social .ic{width:18px}

.legal{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.15);margin-top:36px;padding-top:20px;font-size:13.5px}
.legal a{margin-left:14px}
/* ===== Admin ===== */
#adm{position:fixed;top:0;right:0;bottom:0;width:430px;max-width:100%;background:#fff;border-left:1px solid var(--line);box-shadow:-10px 0 40px rgba(0,0,0,.15);z-index:200;display:none;flex-direction:column;font-size:14px}
body.adm-open #adm{display:flex}
@media(min-width:900px){body.adm-open{margin-right:430px}}
.adm-top{background:var(--g9);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.adm-top strong{font-size:15px}
.adm-bar{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--tint)}
.adm-body{flex:1;overflow:auto;padding:12px 16px 60px}
#adm .b{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
#adm .b.p{background:var(--g7);color:#fff;border-color:var(--g7)}#adm .b.d{color:#b42318}
#adm details{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff}
#adm details details{margin:8px 0;background:var(--tint)}
#adm summary{padding:12px 14px;font-weight:600;cursor:pointer}
#adm .in{padding:0 14px 14px}
#adm label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:10px 0 4px}
#adm input,#adm textarea,#adm select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13.5px;background:#fff}
#adm textarea{min-height:70px;resize:vertical}
#adm .imgf{display:flex;gap:8px;align-items:center;margin-top:6px}
#adm .imgf img{width:48px;height:48px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff}
#adm .act{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
#adm .msg{padding:10px 16px;font-size:13px;background:#fff8e1;border-bottom:1px solid #f1e0a0;display:none}
#adm .msg.show{display:block}#adm .msg.ok{background:#e6f7ee;border-color:#b7e3cb}#adm .msg.err{background:#fdecea;border-color:#f3b8b2}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
@media(max-width:980px){
.g5{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}
.hero,.about-grid,.sol-grid,.consult{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}.foot{grid-template-columns:1fr 1fr}
.menu-btn{display:block}.trade{display:none}
.links{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;flex-direction:column;padding:10px 16px;border-bottom:1px solid var(--line)}
.links.open{display:flex}
}
@media(max-width:620px){.g5,.g4,.g3,.steps,.row,.stages{grid-template-columns:1fr}.foot{grid-template-columns:1fr}.nav-actions .btn{display:none}.sec{padding:56px 0}}
</style>
</head>

function SRC(p){return previews[p]||p}

function merge(b,o){
  if(Array.isArray(o))return o;
  if(o&&typeof o==='object'&&b&&typeof b==='object'&&!Array.isArray(b)){var r={};for(var k in b)r[k]=b[k];for(var k2 in o)r[k2]=merge(b[k2],o[k2]);return r}
  return o===undefined?b:o;
}

}
function applyFilter(){
  var q=curQ.toLowerCase(),n=0;
  document.querySelectorAll('.program').forEach(function(c){
    var ok=(curCat==='all'||c.dataset.cat===curCat)&&(!q||c.textContent.toLowerCase().indexOf(q)>-1);
    c.hidden=!ok;if(ok)n++;
  });
  document.querySelectorAll('.chip').forEach(function(b){b.classList.toggle('on',b.dataset.cat===curCat)});
  var np=document.getElementById('no-programs');if(np)np.hidden=n>0;
  var s=document.getElementById('program-search');if(s&&s.value!==curQ)s.value=curQ;
}

function fieldHTML(path,label,type,val){
  var p=esc(path),l='<label>'+esc(label)+'</label>';
  if(type===A)return l+'<textarea data-p="'+p+'">'+esc(val)+'</textarea>';
  if(type===L)return l+'<textarea data-p="'+p+'" data-lines="1">'+esc((val||[]).join('\n'))+'</textarea>';
  if(type===S)return l+'<select data-p="'+p+'">'+ICON_NAMES.map(function(n){return '<option'+(n===val?' selected':'')+'>'+n+'</option>'}).join('')+'</select>';
  if(type===C)return l+'<select data-p="'+p+'">'+CATS.map(function(c){return '<option value="'+c[0]+'"'+(c[0]===val?' selected':'')+'>'+c[1]+'</option>'}).join('')+'</select>';
  if(type===I)return l+'<input data-p="'+p+'" value="'+esc(val)+'" placeholder="images/… ba https://…"><div class="imgf">'+(val?'<img src="'+esc(SRC(val))+'" alt="">':'')+'<input type="file" accept="image/*" data-up="'+p+'"><button class="b d" data-clear="'+p+'" type="button">Clear</button></div>';
  return l+'<input data-p="'+p+'" value="'+esc(val)+'">';
}
function buildEditor(){
  var body=document.getElementById('adm-body'),open={};
  body.querySelectorAll('details[open]').forEach(function(d){open[d.dataset.id]=1});
  var h='<details data-id="gh"><summary>🔑 GitHub connection (save korar jonno)</summary><div class="in">'+
   '<label>GitHub username</label><input data-st="owner" value="'+esc(st.owner)+'"><label>Repository name</label><input data-st="repo" value="'+esc(st.repo)+'"><label>Branch</label><input data-st="branch" value="'+esc(st.branch)+'">'+
   '<label>Personal Access Token (fine-grained, Contents: Read & write)</label><input data-st="token" type="password" value="'+esc(st.token)+'" placeholder="github_pat_…"><p class="hint">Token sudhu apnar browser e thake (localStorage). Kokhono index.html e likhben na.</p></div></details>';
  SCHEMA.forEach(function(sec){
    h+='<details data-id="'+sec.k+'"><summary>'+esc(sec.t)+'</summary><div class="in">';
    (sec.f||[]).forEach(function(f){h+=fieldHTML(sec.k+'.'+f[0],f[1],f[2],getP(cfg,sec.k+'.'+f[0]))});
    (sec.lists||[]).forEach(function(ls){
      var lp=sec.k+'.'+ls.k,arr=getP(cfg,lp)||[];
      h+='<label style="margin-top:16px">'+esc(ls.t)+' ('+arr.length+')</label>';
      arr.forEach(function(it,i){
        h+='<details data-id="'+lp+'.'+i+'"><summary>'+(i+1)+'. '+esc((it[ls.lk]||'(empty)').toString().slice(0,34))+'</summary><div class="in">';
        ls.f.forEach(function(f){h+=fieldHTML(lp+'.'+i+'.'+f[0],f[1],f[2],it[f[0]])});
        h+='<div class="act"><button class="b" data-act="up" data-list="'+lp+'" data-i="'+i+'">↑</button><button class="b" data-act="down" data-list="'+lp+'" data-i="'+i+'">↓</button><button class="b d" data-act="del" data-list="'+lp+'" data-i="'+i+'">Delete</button></div></div></details>';
      });
      h+='<button class="b p" data-act="add" data-list="'+lp+'">+ Add</button>';
    });
    h+='</div></details>';
  });
  body.innerHTML=h;
  body.querySelectorAll('details').forEach(function(d){if(open[d.dataset.id])d.open=true});
}
function msg(t,cls){var m=document.getElementById('adm-msg');m.textContent=t;m.className='msg show '+(cls||'');if(t==='')m.className='msg'}
var rt;function later(){clearTimeout(rt);rt=setTimeout(function(){var y=scrollY;render();scrollTo(0,y)},250)}

/* image helpers */
function readImage(file,max){
  return new Promise(function(res,rej){
    if(file.type==='image/svg+xml'||file.type==='image/gif'){var r=new FileReader();r.onload=function(){res({data:r.result,type:file.type})};r.onerror=rej;r.readAsDataURL(file);return}
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var s=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');
      cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      var png=file.type==='image/png',type=png?'image/png':'image/jpeg';
      res({data:cv.toDataURL(type,.85),type:type});URL.revokeObjectURL(url)};
    im.onerror=rej;im.src=url;
  });
}
function gh(method,path,body){
  return fetch('https://api.github.com/repos/'+st.owner+'/'+st.repo+path,{method:method,headers:{'Authorization':'Bearer '+st.token,'Accept':'application/vnd.github+json'},body:body?JSON.stringify(body):undefined});
}
function ghReady(){if(!st.owner||!st.repo||!st.token){msg('Age "GitHub connection" e username, repo ar token din.','err');document.querySelector('[data-id=gh]').open=true;return false}return true}
function putFile(path,b64,message){
  return gh('GET','/contents/'+path+'?ref='+encodeURIComponent(st.branch)).then(function(r){return r.status===200?r.json():null}).then(function(ex){
    var b={message:message,content:b64,branch:st.branch};if(ex&&ex.sha)b.sha=ex.sha;
    return gh('PUT','/contents/'+path,b);
  }).then(function(r){if(!r.ok)return r.json().then(function(j){throw new Error(j.message||('HTTP '+r.status))});return r.json()});
}
function uploadImage(path,file){
  var prefix=path.indexOf('logo')>-1||path.indexOf('favicon')>-1?600:1600;
  msg('Image process hocche…');
  readImage(file,prefix).then(function(img){
    var b64=img.data.split(',')[1],ext=img.type==='image/png'?'png':img.type==='image/svg+xml'?'svg':img.type==='image/gif'?'gif':'jpg';
    var base=file.name.replace(/\.[^.]+$/,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,30)||'img';
    var name='images/'+Date.now()+'-'+base+'.'+ext;
    if(st.token&&st.owner&&st.repo){
      return putFile(name,b64,'Admin: upload '+name).then(function(){previews[name]=img.data;setP(cfg,path,name);msg('Uploaded: '+name+' (site e live hote ~1 min lagbe)','ok')});
    }
    setP(cfg,path,img.data);msg('Token nai, tai image JSON er bhitore embed holo (boro hole slow). GitHub connect kore abar upload korun.','err');
  }).catch(function(e){msg('Upload failed: '+e.message,'err')}).then(function(){render();buildEditor()});
}
function saveGitHub(){
  if(!ghReady())return;
  msg('Saving…');
  var json=JSON.stringify(cfg,null,2),b64=btoa(unescape(encodeURIComponent(json)));
  putFile('data.json',b64,'Admin: update site content').then(function(){msg('✔ Saved! GitHub Pages deploy hote ~1-2 min lage, tarpor sobai dekhbe (Ctrl+F5 diye refresh).','ok')}).catch(function(e){msg('Save failed: '+e.message+' (token, repo name, permission check korun)','err')});
}

var adm=document.getElementById('adm');
function openAdm(){document.body.classList.add('adm-open');buildEditor()}
function closeAdm(){document.body.classList.remove('adm-open');if(location.hash==='#admin')history.replaceState(null,'',location.pathname+location.search)}
adm.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset.st){st[el.dataset.st]=el.value.trim();saveSt();return}
  if(el.dataset.p){setP(cfg,el.dataset.p,el.dataset.lines?el.value.split('\n').map(function(x){return x.trim()}).filter(Boolean):el.value);later()}
});
adm.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset.up&&el.files[0]){uploadImage(el.dataset.up,el.files[0]);el.value=''}
  else if(el.dataset.p&&el.tagName==='SELECT'){setP(cfg,el.dataset.p,el.value);render()}
});
adm.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.clear){setP(cfg,b.dataset.clear,'');render();buildEditor();return}
  if(b.dataset.act){
    var arr=getP(cfg,b.dataset.list),i=+b.dataset.i,act=b.dataset.act;
    if(act==='add'){var sec=SCHEMA.filter(function(s){return b.dataset.list.indexOf(s.k+'.')===0})[0],ls=sec.lists.filter(function(l){return b.dataset.list===sec.k+'.'+l.k})[0];arr.push(clone(ls.n))}
    else if(act==='del'){if(confirm('Delete this item?'))arr.splice(i,1);else return}
    else if(act==='up'&&i>0){var t=arr[i];arr[i]=arr[i-1];arr[i-1]=t}
    else if(act==='down'&&i<arr.length-1){var t2=arr[i];arr[i]=arr[i+1];arr[i+1]=t2}
    render();buildEditor();return;
  }
});
document.getElementById('adm-close').onclick=closeAdm;
document.getElementById('adm-save').onclick=saveGitHub;
document.getElementById('adm-export').onclick=function(){
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'}));a.download='data.json';a.click();
};
document.getElementById('adm-import').onclick=function(){document.getElementById('adm-file').click()};
document.getElementById('adm-file').onchange=function(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{cfg=merge(D,JSON.parse(r.result));render();buildEditor();msg('Imported.','ok')}catch(x){msg('Invalid JSON file','err')}};r.readAsText(f);e.target.value='';
};
