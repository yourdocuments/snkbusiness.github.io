<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNK Business | Corporate Training</title>
<meta name="description" content="Role-based corporate training in AI, Data, Technology and Business, customized to your business goals.">
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<div id="app"></div>
<script src="assets/firebase-config.js"></script>
<script src="assets/core.js"></script>
<script>
var cfg=clone(D),curCat='all',curQ='';
var PREVIEW=/[?&]preview=1/.test(location.search);
function render(){
  document.getElementById('app').innerHTML=html(cfg);
  document.title=cfg.site.title;
  var m=document.querySelector('meta[name=description]');if(m)m.setAttribute('content',cfg.site.description);
  var fv=document.getElementById('favicon'),ico=cfg.site.favicon||cfg.site.logo;
  if(ico)fv.href=SRC(ico);
  applyFilter();
}
function applyFilter(){
  var q=curQ.toLowerCase(),n=0;
  document.querySelectorAll('.program').forEach(function(c){
    var ok=(curCat==='all'||c.dataset.cat===curCat)&&(!q||c.textContent.toLowerCase().indexOf(q)>-1);
    c.hidden=!ok;if(ok)n++;
  });
  document.querySelectorAll('.chip').forEach(function(b){b.classList.toggle('on',b.dataset.cat===curCat)});
  var np=document.getElementById('no-programs');if(np)np.hidden=n>0;
  var s=document.getElementById('program-search');if(s&&s.value!==curQ)s.value=curQ;
}

/* ===================== SITE EVENTS (delegation) ===================== */
document.addEventListener('click',function(e){
  var t=e.target;
  var mt=t.closest('#menu-toggle');
  if(mt){var l=document.getElementById('main-links');var o=l.classList.toggle('open');mt.setAttribute('aria-expanded',o)}
  else if(t.closest('#main-links a')){document.getElementById('main-links').classList.remove('open')}
  var ch=t.closest('.chip');if(ch){curCat=ch.dataset.cat;applyFilter()}
  var fq=t.closest('.faq-q');if(fq){var it=fq.parentNode,a=it.querySelector('.faq-a'),op=it.classList.toggle('open');a.hidden=!op;fq.setAttribute('aria-expanded',op)}
});
document.addEventListener('input',function(e){if(e.target.id==='program-search'){curQ=e.target.value;applyFilter()}});
document.addEventListener('submit',function(e){
  if(e.target.id!=='request-form')return;
  e.preventDefault();
  var fd=new FormData(e.target),txt='New corporate training request:\n';
  fd.forEach(function(v,k){if(v)txt+=k+': '+v+'\n'});
  var note=document.getElementById('form-note'),wa=(cfg.consult.whatsapp||'').replace(/\D/g,''),em=(cfg.consult.email||'').trim();
  if(wa){window.open('https://wa.me/'+wa+'?text='+encodeURIComponent(txt),'_blank');note.textContent='Opening WhatsApp… please press Send to submit your request.'}
  else if(em){location.href='mailto:'+em+'?subject='+encodeURIComponent('Corporate Training Request')+'&body='+encodeURIComponent(txt);note.textContent='Opening your email app…'}
  else{note.textContent='Form contact not set yet. Admin → Consultation e WhatsApp ba Email din.'}
});


var rt;function later(){clearTimeout(rt);rt=setTimeout(function(){var y=scrollY;render();scrollTo(0,y)},250)}
function fbOK(){return !!(window.FB&&window.FB.enabled)}
function walkFb(o,out){if(typeof o==='string'){if(/^fb:/.test(o))out[o]=1}else if(o&&typeof o==='object'){for(var k in o)walkFb(o[k],out)}return out}
function loadImgs(){
  Object.keys(walkFb(cfg,{})).filter(function(k){return !previews[k]}).forEach(function(k){
    FB.getImage(k.slice(3)).then(function(d){if(d){previews[k]=d;later()}}).catch(function(){});
  });
}
function initFB(){
  if(!fbOK())return;
  FB.load().then(function(r){
    if(r&&r.json){try{localStorage.setItem('snk_cache',r.json)}catch(e){}cfg=merge(D,JSON.parse(r.json));render()}
    loadImgs();
  }).catch(function(e){console.warn('Firebase load failed',e)});
}
/* live preview from dashboard */
window.addEventListener('message',function(e){
  if(e.origin!==location.origin)return;
  var d=e.data||{};
  if(d.snkPreview){for(var k in d.previews)previews[k]=d.previews[k];var y=scrollY;cfg=merge(D,d.cfg);render();scrollTo(0,y)}
  if(d.snkScroll){var el=document.querySelector(d.snkScroll);if(el)el.scrollIntoView()}
});
/* boot */
if(!PREVIEW){try{var cj=localStorage.getItem('snk_cache');if(cj)cfg=merge(D,JSON.parse(cj))}catch(e){}}
render();
if(PREVIEW){try{parent.postMessage({snkReady:1},location.origin)}catch(e){}}
else{if(window.FB)initFB();else window.addEventListener('fbready',initFB)}
</script>
<script type="module" src="assets/firebase.js"></script>
</body>
</html>
