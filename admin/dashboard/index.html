<script>
var $=function(i){return document.getElementById(i)};
var cfg=clone(D),dirty=false,view='overview',lastSaved=null,pvReady=false,inited=false,user=null;
var T='t',A='a',I='i',L='lines',S='s',C='c';
var SCHEMA=[
 {k:'site',t:'Browser Title, Logo & Top Bar',f:[['title','Browser tab title',T],['description','Meta description (SEO)',A],['brand','Brand name',T],['logo','Logo (header, CTA, footer)',I],['favicon','Favicon (empty = logo use hobe)',I],['utilL','Top bar left text',T],['utilR','Top bar right text',T]]},
 {k:'nav',t:'Menu & Header Buttons',f:[['tradeLabel','"Trade" link text',T],['tradeHref','"Trade" link',T],['ctaLabel','Header button text',T],['ctaHref','Header button link',T]],lists:[{k:'links',t:'Menu links',lk:'label',n:{label:'New',href:'#'},f:[['label','Label',T],['href','Link (#id ba https://…)',T]]}]},
 {k:'hero',t:'Hero Banner',f:[['label','Small label',T],['title','Heading',A],['intro','Intro text',A],['b1Label','Button 1 text',T],['b1Href','Button 1 link',T],['b2Label','Button 2 text',T],['b2Href','Button 2 link (brochure.pdf = download)',T],['image','Banner image',I],['capTitle','Caption title',T],['capSub','Caption sub text',T],['highlights','Highlights (ek line = ekta)',L]]},
 {k:'about',t:'About',f:[['label','Label',T],['title','Title',A],['text','Text',A],['pSmall','Left card small text',T],['pLabel','Left card label',T],['pTitle','Left card title',T],['pText','Left card text',A],['whyLabel','Right label',T],['whyTitle','Right title',T],['whyText','Right text',A]],lists:[{k:'reasons',t:'Reasons',lk:'title',n:{icon:'sparkle',title:'New reason',text:''},f:[['icon','Icon',S],['title','Title',T],['text','Text',A]]}]},
 {k:'categories',t:'Category Cards',f:[['label','Label',T],['title','Title',T],['text','Text',T]],lists:[{k:'items',t:'Category cards',lk:'title',n:{icon:'sparkle',title:'New category',sub:'',href:'#trainings'},f:[['icon','Icon',S],['title','Title',T],['sub','Sub text',T],['href','Card link',T]]}]},
 {k:'programs',t:'Training Programs',f:[['label','Label',T],['title','Title',T],['text','Text',T]],lists:[{k:'items',t:'Programs',lk:'title',n:{cat:'business',tag:'Tag',icon:'sparkle',title:'New program',desc:'',meta:'Onsite • Online • Blended',aud:'Corporate Teams',href:'#consultation'},f:[['title','Title',T],['tag','Tag on card',T],['cat','Filter category',C],['icon','Icon',S],['desc','Description',A],['meta','Delivery text',T],['aud','Audience text',T],['href','Request link',T]]}]},
 {k:'delivery',t:'Delivery Formats',f:[['label','Label',T],['title','Title',T],['text','Text',T]],lists:[{k:'items',t:'Formats',lk:'title',n:{icon:'building',title:'New',text:''},f:[['icon','Icon',S],['title','Title',T],['text','Text',A]]}]},
 {k:'team',t:'Team',f:[['label','Label',T],['title','Title',T],['text','Text',T],['btnLabel','Button text',T],['btnHref','Button link',T]],lists:[{k:'items',t:'Team members',lk:'name',n:{initials:'NN',photo:'',name:'New member',role:'',desc:'',href:'#consultation'},f:[['name','Name',T],['role','Role',T],['desc','Short text',T],['initials','Initials (photo na thakle)',T],['photo','Photo',I],['href','Profile link',T]]}]},
 {k:'solutions',t:'Corporate Solutions',f:[['label','Label',T],['title','Title',T],['text','Text',A],['checks','Checklist (ek line = ekta)',L],['jTitle','Journey title',T],['jText','Journey text',A],['btnLabel','Button text',T],['btnHref','Button link',T]],lists:[{k:'stages',t:'Journey stages',lk:'title',n:{icon:'clipboard',title:'Stage',text:''},f:[['icon','Icon',S],['title','Title',T],['text','Text',T]]}]},
 {k:'how',t:'How It Works',f:[['label','Label',T],['title','Title',T]],lists:[{k:'steps',t:'Steps',lk:'title',n:{title:'Step',text:''},f:[['title','Title',T],['text','Text',A]]}]},
 {k:'consult',t:'Consultation & Form',f:[['label','Label',T],['title','Title',A],['text','Text',A],['checks','Checklist (ek line = ekta)',L],['noteTitle','Note title',T],['noteText','Note text',A],['formTitle','Form title',T],['formText','Form text',T],['formBtn','Form button text',T],['whatsapp','WhatsApp number (country code shoho, e.g. 8801XXXXXXXXX)',T],['email','Email (WhatsApp na dile email e jabe)',T]]},
 {k:'faq',t:'FAQ',f:[['label','Label',T],['title','Title',T],['moreText','Bottom text',T],['moreLabel','Bottom link text',T],['moreHref','Bottom link',T]],lists:[{k:'items',t:'Questions',lk:'q',n:{q:'New question?',a:''},f:[['q','Question',T],['a','Answer',A]]}]},
 {k:'cta',t:'Bottom CTA Strip',f:[['text','Text',T],['btnLabel','Button text',T],['btnHref','Button link',T]]},
 {k:'footer',t:'Footer & Social',f:[['about','About text',A],['fb','Facebook link',T],['li','LinkedIn link',T],['copy','Copyright text',T]],lists:[{k:'cols',t:'Footer columns',lk:'title',n:{title:'New column',links:['Link|#']},f:[['title','Title',T],['links','Links (ek line = ekta, format: Label|link)',L]]}]}
];

function fieldHTML(path,label,type,val){
  var p=esc(path),l='<label>'+esc(label)+'</label>';
  if(type===A)return l+'<textarea data-p="'+p+'">'+esc(val)+'</textarea>';
  if(type===L)return l+'<textarea data-p="'+p+'" data-lines="1">'+esc((val||[]).join('\n'))+'</textarea>';
  if(type===S)return l+'<select data-p="'+p+'">'+ICON_NAMES.map(function(n){return '<option'+(n===val?' selected':'')+'>'+n+'</option>'}).join('')+'</select>';
  if(type===C)return l+'<select data-p="'+p+'">'+CATS.map(function(c){return '<option value="'+c[0]+'"'+(c[0]===val?' selected':'')+'>'+c[1]+'</option>'}).join('')+'</select>';
  if(type===I)return l+'<input data-p="'+p+'" value="'+esc(val)+'" placeholder="images/… ba https://…"><div class="imgf">'+(val?'<img src="'+esc(SRC(val))+'" alt="">':'')+'<input type="file" accept="image/*" data-up="'+p+'"><button class="b d" data-clear="'+p+'" type="button">Clear</button></div>';
  return l+'<input data-p="'+p+'" value="'+esc(val)+'">';
}
function readImage(file,max){
  return new Promise(function(res,rej){
    if(file.type==='image/svg+xml'||file.type==='image/gif'){var r=new FileReader();r.onload=function(){res({data:r.result,type:file.type})};r.onerror=rej;r.readAsDataURL(file);return}
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var s=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');
      cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      var png=file.type==='image/png',type=png?'image/png':'image/jpeg';
      res({data:cv.toDataURL(type,.85),type:type});URL.revokeObjectURL(url)};
    im.onerror=rej;im.src=url;
  });
}

var ANCH={hero:'#home',about:'#about',categories:'#categories',programs:'#trainings',delivery:'#delivery',team:'#team',solutions:'#solutions',how:'#how',consult:'#consultation',faq:'#faq',footer:'footer',cta:'.cta'};
function fbOK(){return !!(window.FB&&window.FB.enabled)}
function ready(cb){if(window.FB)cb();else window.addEventListener('fbready',cb,{once:true})}
var tt;function toast(t,c){var m=$('toast');m.textContent=t;m.className='toast show '+(c||'');clearTimeout(tt);if(c!=='err')tt=setTimeout(function(){m.className='toast'},3800)}
function setDirty(v){dirty=v;$('save').classList.toggle('dirty',v);$('dirtyTag').hidden=!v}
function pushPreview(){var f=$('pv');if(f&&f.contentWindow&&pvReady)f.contentWindow.postMessage({snkPreview:1,cfg:cfg,previews:previews},location.origin)}
var pt;function schedPreview(){clearTimeout(pt);pt=setTimeout(pushPreview,200)}
function scrollPreview(){var a=ANCH[view];var f=$('pv');if(a&&f&&f.contentWindow&&pvReady)f.contentWindow.postMessage({snkScroll:a},location.origin)}
$('pv').addEventListener('load',function(){pvReady=true;pushPreview()});
window.addEventListener('message',function(e){if(e.origin===location.origin&&e.data&&e.data.snkReady){pvReady=true;pushPreview()}});

function buildNav(){
  var items=[{k:'overview',t:'📊 Overview'}].concat(SCHEMA.map(function(x){return {k:x.k,t:x.t}})).concat([{k:'account',t:'👤 Account'}]);
  $('nav').innerHTML=items.map(function(it){return '<button data-view="'+it.k+'" class="'+(it.k===view?'on':'')+'">'+esc(it.t)+'</button>'}).join('');
}
function stat(n,l){return '<div class="stat"><strong>'+n+'</strong><span>'+l+'</span></div>'}
function fmt(d){try{return d.toLocaleString()}catch(e){return ''}}
function renderView(keepOpen){
  var main=$('main'),open={};
  if(keepOpen)main.querySelectorAll('details[open]').forEach(function(d){open[d.dataset.id]=1});
  var h='';
  if(view==='overview'){
    var warn=(!cfg.consult.whatsapp&&!cfg.consult.email)?'<div class="alert">⚠ Contact form-er WhatsApp number ba email set kora nai. "Consultation & Form" section e din, noile form kaj korbe na.</div>':'';
    h='<h2>Overview</h2><p class="sub">Bam pasher menu theke section select kore edit korun. Dan pashe live preview dekhben. Shesh e <b>Save</b> chapun.</p>'+
      '<div class="stats">'+stat(cfg.programs.items.length,'Programs')+stat(cfg.categories.items.length,'Category cards')+stat(cfg.team.items.length,'Team members')+stat(cfg.faq.items.length,'FAQ')+'</div>'+
      '<div class="panel"><h3>Status</h3><p>Last saved: '+(lastSaved?esc(fmt(lastSaved)):'ekhono save kora hoy nai (default content)')+'</p>'+warn+'</div>'+
      '<div class="panel"><h3>Quick actions</h3><div class="act"><button class="b" data-q="export">Export JSON backup</button><button class="b" data-q="import">Import JSON</button><button class="b d" data-q="reset">Reset to defaults</button></div><p class="hint">Reset korle sudhu ei page-e default fire ashe. Save na dile live site bodlay na.</p></div>';
  }else if(view==='account'){
    h='<h2>Account</h2><p class="sub">Admin account-er tothyo.</p><div class="panel"><h3>Logged in as</h3><p>'+esc(user?user.email:'')+'</p><div class="act"><button class="b" data-q="resetpw">Password reset email pathan</button><button class="b d" data-q="logout">Logout</button></div><p class="hint">Reset email-e link diye notun password set korte parben.</p></div>';
  }else{
    var sec=SCHEMA.filter(function(x){return x.k===view})[0];
    h='<h2>'+esc(sec.t)+'</h2><p class="sub">Change korle dan pashe preview-te sathe sathe dekhben.</p><div class="panel">';
    (sec.f||[]).forEach(function(f){h+=fieldHTML(sec.k+'.'+f[0],f[1],f[2],getP(cfg,sec.k+'.'+f[0]))});
    h+='</div>';
    (sec.lists||[]).forEach(function(ls){
      var lp=sec.k+'.'+ls.k,arr=getP(cfg,lp)||[];
      h+='<div class="listhead"><strong>'+esc(ls.t)+' ('+arr.length+')</strong><button class="b p sm" data-act="add" data-list="'+lp+'">+ Add</button></div><div class="panel">';
      if(!arr.length)h+='<p class="hint">Kono item nai. + Add chapun.</p>';
      arr.forEach(function(it,i){
        h+='<details data-id="'+lp+'.'+i+'"><summary>'+(i+1)+'. '+esc(String(it[ls.lk]||'(empty)').slice(0,40))+'</summary><div class="in">';
        ls.f.forEach(function(f){h+=fieldHTML(lp+'.'+i+'.'+f[0],f[1],f[2],it[f[0]])});
        h+='<div class="act"><button class="b sm" data-act="up" data-list="'+lp+'" data-i="'+i+'">↑ Up</button><button class="b sm" data-act="down" data-list="'+lp+'" data-i="'+i+'">↓ Down</button><button class="b sm d" data-act="del" data-list="'+lp+'" data-i="'+i+'">Delete</button></div></div></details>';
      });
      h+='</div>';
    });
  }
  var sy=main.scrollTop;
  main.innerHTML=h;
  main.querySelectorAll('details').forEach(function(d){if(open[d.dataset.id])d.open=true});
  if(keepOpen)main.scrollTop=sy;
}
function go(v){view=v;buildNav();renderView(false);$('main').scrollTop=0;scrollPreview();$('pvbox').classList.remove('show')}

/* ----- events ----- */
$('nav').addEventListener('click',function(e){var b=e.target.closest('button');if(b)go(b.dataset.view)});
var main=$('main');
main.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset.p){setP(cfg,el.dataset.p,el.dataset.lines?el.value.split('\n').map(function(x){return x.trim()}).filter(Boolean):el.value);setDirty(true);schedPreview()}
});
main.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset.up&&el.files[0]){uploadImage(el.dataset.up,el.files[0]);el.value=''}
  else if(el.dataset.p&&el.tagName==='SELECT'){setP(cfg,el.dataset.p,el.value);setDirty(true);schedPreview()}
});
main.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.clear){setP(cfg,b.dataset.clear,'');setDirty(true);renderView(true);schedPreview();return}
  if(b.dataset.q){
    var q=b.dataset.q;
    if(q==='export'){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'}));a.download='snk-content-backup.json';a.click()}
    else if(q==='import')$('importFile').click();
    else if(q==='reset'){if(confirm('Sob kichu default e fire jabe (Save na korle live site bodlabe na). Continue?')){cfg=clone(D);setDirty(true);renderView(false);schedPreview()}}
    else if(q==='logout')doLogout();
    else if(q==='resetpw'&&user){FB.reset(user.email).then(function(){toast('Password reset email pathano hoyeche.','ok')}).catch(function(x){toast(x.message,'err')})}
    return;
  }
  if(b.dataset.act){
    var arr=getP(cfg,b.dataset.list),i=+b.dataset.i,act=b.dataset.act;
    if(act==='add'){
      var sec=SCHEMA.filter(function(s){return b.dataset.list.indexOf(s.k+'.')===0})[0],ls=sec.lists.filter(function(l){return b.dataset.list===sec.k+'.'+l.k})[0];
      arr.push(clone(ls.n));
    }
    else if(act==='del'){if(!confirm('Ei item ta delete korben?'))return;arr.splice(i,1)}
    else if(act==='up'&&i>0){var t=arr[i];arr[i]=arr[i-1];arr[i-1]=t}
    else if(act==='down'&&i<arr.length-1){var t2=arr[i];arr[i]=arr[i+1];arr[i+1]=t2}
    setDirty(true);renderView(true);schedPreview();
    if(act==='add'){var ds=main.querySelectorAll('details');if(ds.length){var last=ds[ds.length-1];last.open=true;last.scrollIntoView({block:'center'})}}
  }
});
$('importFile').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{cfg=merge(D,JSON.parse(r.result));setDirty(true);renderView(false);schedPreview();toast('Imported. Save chapun.','ok')}catch(x){toast('Invalid JSON file','err')}};
  r.readAsText(f);e.target.value='';
});
document.querySelectorAll('[data-dev]').forEach(function(b){b.addEventListener('click',function(){$('pvframe').classList.toggle('mob',b.dataset.dev==='m')})});
$('pvToggle').addEventListener('click',function(){$('pvbox').classList.toggle('show');pushPreview()});
function doLogout(){if(dirty&&!confirm('Unsaved change ache. Tobuo logout?'))return;dirty=false;FB.logout().then(function(){location.replace('../login/')})}
$('logout').addEventListener('click',doLogout);
$('save').addEventListener('click',save);
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save()}});
window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue=''}});

/* ----- images + save ----- */
function readFit(file,max){
  var tries=[1,.75,.55,.4,.3],i=0;
  function step(){
    return readImage(file,Math.round(max*tries[i])).then(function(img){
      if(img.data.length<=700000||i>=tries.length-1||file.type==='image/svg+xml'||file.type==='image/gif')return img;
      i++;return step();
    });
  }
  return step();
}
function uploadImage(path,file){
  var max=(path.indexOf('logo')>-1||path.indexOf('favicon')>-1)?500:1400;
  toast('Image process hocche…');
  readFit(file,max).then(function(img){
    if(img.data.length>900000)throw new Error('Image onek boro, chhoto image din');
    var id=Date.now().toString(36)+Math.random().toString(36).slice(2,6),key='fb:'+id;
    return FB.saveImage(id,img.data).then(function(){previews[key]=img.data;setP(cfg,path,key);setDirty(true);toast('Image upload hoyeche. Save chapun.','ok')});
  }).catch(function(e){toast('Upload failed: '+e.message,'err')}).then(function(){renderView(true);schedPreview()});
}
function save(){
  var j=JSON.stringify(cfg);
  if(j.length>900000){toast('Content onek boro (image embed ache?). Image gulo upload kore use korun.','err');return}
  toast('Saving…');
  FB.save(j).then(function(){try{localStorage.setItem('snk_cache',j)}catch(e){}lastSaved=new Date();setDirty(false);toast('✔ Saved! Live site-e sobai ekhon notun content dekhbe.','ok');if(view==='overview')renderView(false)})
   .catch(function(e){toast('Save failed: '+e.message+' (Firestore rules ar login check korun)','err')});
}

/* ----- boot ----- */
function walkFb(o,out){if(typeof o==='string'){if(/^fb:/.test(o))out[o]=1}else if(o&&typeof o==='object'){for(var k in o)walkFb(o[k],out)}return out}
function init(){
  buildNav();renderView(false);
  FB.load().then(function(r){
    if(r&&r.json){cfg=merge(D,JSON.parse(r.json));lastSaved=r.updated}
    renderView(false);pushPreview();
    var keys=Object.keys(walkFb(cfg,{}));
    return Promise.all(keys.map(function(k){return FB.getImage(k.slice(3)).then(function(d){if(d)previews[k]=d}).catch(function(){})}));
  }).then(function(){renderView(false);pushPreview()}).catch(function(e){toast('Content load hoy nai: '+e.message,'err')});
}
ready(function(){
  if(!FB.enabled){$('gateMsg').innerHTML='Firebase config set kora nai.<br>assets/firebase-config.js file e config boshan.<br><br><a class="b" href="../login/">Login page</a>';return}
  FB.onAuth(function(u){
    if(!u){location.replace('../login/');return}
    user=u;$('uemail').textContent=u.email;$('gate').hidden=true;
    if(!inited){inited=true;init()}
  });
});
setTimeout(function(){if(!window.FB)$('gateMsg').textContent='Firebase load hocche na. Internet check korun, ar hosted site theke kholun.'},8000);
</script>
